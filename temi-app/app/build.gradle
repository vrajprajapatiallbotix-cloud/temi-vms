plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34
    namespace 'com.vms.temi'

    defaultConfig {
        applicationId "com.vms.temi"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "VMS_API_BASE_URL", '"https://congenial-eureka-r4qxq57xw55r3ww9r-5000.app.github.dev/api"'
        buildConfigField "String", "TEMI_SERIAL", '"00126040079"'
        buildConfigField "String", "TEMI_API_KEY", '"temi_internal_api_key"'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile     file('../nanta-temi.jks')
            storePassword 'Nanta@2024'
            keyAlias      'nanta-temi'
            keyPassword   'Nanta@2024'
        }
    }

    buildTypes {
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.robotemi:sdk:1.137.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation ('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
}
